[project]
name = "spotify-taste"
version = "0.1.0"
description = "Spotify 청취 로그 자체 수집 · 취향 분석 · LLM 주간 추천"
readme = "README.md"
authors = [
    { name = "Mizeloble", email = "mizeloble@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "rich>=15.0.0",
    "structlog>=25.5.0",
    "typer>=0.24.2",
]

[project.scripts]
spotify-taste = "spotify_taste.cli:app"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 형제 프로젝트(auto-stock-trading)는 session 루프 스코프를 쓰지만 그 사유는
# 키움 토큰 발급 rate limit 회피다. 여기엔 그 사유가 없고(Spotify 토큰은 디스크
# 캐시), 살아있는 httpx.AsyncClient 를 소유하는 테스트에는 function 스코프가
# 엄격히 더 안전하다 — 의도적 이탈.
asyncio_default_fixture_loop_scope = "function"
# 기본 실행 시 통합 테스트 제외. `pytest -m integration` 으로 명시 선택.
addopts = "-m 'not integration'"
markers = [
    "integration: 실 Spotify API 호출 테스트. 유효한 토큰 번들 필요",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter 가 처리)
    "B008",  # function default (typer Option 패턴 충돌)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false   # 초기 도입 단계는 관대 — 점진 강화 예정
ignore_missing_imports = true
